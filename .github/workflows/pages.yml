name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble the Pages artifact
        # Pages serves the artifact root at the `base` in config/site.json, so
        # the build goes at the root and the archive's puzzles beside it.
        run: |
          mkdir -p artifact/puzzles
          cp -r site/dist/. artifact/
          cp puzzles/*.json artifact/puzzles/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifact
      - id: deployment
        uses: actions/deploy-pages@v4
